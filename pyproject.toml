[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnivoice-cloner"
version = "0.1.0"
description = "OmniVoice Cloner - Desktop Voice Cloning & TTS Application"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [{name = "OmniVoice Cloner Team"}]

dependencies = [
    "PySide6>=6.7",
    "torch>=2.4",
    "torchaudio>=2.4",
    "transformers>=5.3.0",
    "omnivoice",
    "pydub",
    "soundfile",
    "numpy",
]

[project.scripts]
omnivoice-cloner = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }
